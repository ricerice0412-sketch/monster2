<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Monster 5 AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
  <style>
    html,body{margin:0;height:100%;background:#000;}
    model-viewer{width:100%;height:100%;}
    .hint{position:fixed;left:12px;bottom:12px;color:#fff;font:14px/1.3 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;opacity:.8}
  </style>
  <meta name="theme-color" content="#000"/>
</head>
<body>
  <model-viewer
    id="mv"
    src="./m5.glb"
    ios-src="./m5.usdz"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="auto"
    ar-placement="floor"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    environment-image="neutral">
  </model-viewer>

  <div class="hint">
    📱 iPhone 用 Safari（需 m5.usdz）｜ 🤖 Android 用 Chrome（https 环境）
  </div>
</body>
</html>
