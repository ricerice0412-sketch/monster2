<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Monster AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
  <style>
    html,body{margin:0;height:100%;background:#000;}
    model-viewer{width:100%;height:100%;}
    .hint{position:fixed;left:12px;bottom:12px;color:#fff;font:14px/1.3 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;opacity:.8}
  </style>
</head>
<body>
  <model-viewer
    id="mv"
    src="https://ricerice0412-sketch.github.io/monster5/m5.glb"
    ios-src="https://ricerice0412-sketch.github.io/monster5/m5.usdz"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="auto"
    ar-placement="floor"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    environment-image="neutral">
  </model-viewer>
  <div class="hint">iPhone 用 Safari（需 .usdz）｜ Android 用 Chrome</div>
</body>
</html>
