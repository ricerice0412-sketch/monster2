<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Monster 5 AR</title>
  <!-- 引入 Google Model Viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
    }
    model-viewer {
      width: 100%;
      height: 100%;
    }
    .hint {
      position: fixed;
      left: 12px;
      bottom: 12px;
      color: #fff;
      font: 14px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      opacity: 0.8;
    }
  </style>
  <meta name="theme-color" content="#000"/>
</head>

<body>
  <!-- 3D 模型 + AR 模式 -->
  <model-viewer
    id="mv"
    src="./m5.glb"                <!-- Android 使用 glb -->
    ios-src="./m5.usdz"           <!-- iPhone 使用 usdz -->
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="auto"               <!-- 在 AR 中允许手势缩放 -->
    ar-placement="floor"          <!-- 在地面上放置模型 -->
    camera-controls
    auto-rotate
    shadow-intensity="1"
    environment-image="neutral">
  </model-viewer>

  <div class="hint">📱 iPhone 用 Safari（需 .usdz）｜ 🤖 Android 用 Chrome（.glb）</div>

  <script>
    // 可选：初始缩小模型尺寸
    const mv = document.getElementById('mv');
    mv.addEventListener('load', () => {
      const s = 0.3; // 调整缩放比例 0.1-1.0
      mv.scale = `${s} ${s} ${s}`;
    });
  </script>
</body>
</html>
